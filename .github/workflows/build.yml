name: Build Cycles VJ OBS Plugin

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: 1. Forras letoltese
      uses: actions/checkout@v4

    - name: 2. MSVC Fordito beallitasa
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: 3. Inno Setup Telepitese
      run: choco install innosetup -y --no-progress

    - name: 4. OBS SDK es Lib elokeszitese
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        
        New-Item -ItemType Directory -Path "C:\obs-bin", "C:\obs-dev" -Force | Out-Null
        
        Write-Host "OBS letoltese..."
        $release = Invoke-RestMethod -Uri "https://api.github.com/repos/obsproject/obs-studio/releases/tags/30.0.2" -Headers @{ "User-Agent" = "PowerShell" }
        $asset = $release.assets | Where-Object { $_.name -like "*.zip" -and $_.name -notlike "*pdb*" } | Select-Object -First 1
        
        $downloadUrl = if ($asset) { $asset.browser_download_url } else { "https://github.com/obsproject/obs-studio/releases/download/30.0.2/OBS-Studio-30.0.2.zip" }
        curl.exe -fL $downloadUrl -o "obs.zip"
        
        7z x "obs.zip" -o"C:\obs-bin" -y | Out-Null
        git clone --depth 1 https://github.com/obsproject/obs-studio.git -b 30.0.2 C:\obs-src
        
        $dll = Get-ChildItem -Path "C:\obs-bin" -Filter "obs.dll" -Recurse | Select-Object -First 1 -ExpandProperty FullName
        $rawDump = & dumpbin /exports $dll
        $exports = $rawDump | ForEach-Object {
            if ($_ -match '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)') { $matches[1] }
        }
        
        $defContent = @("EXPORTS") + $exports
        [System.IO.File]::WriteAllLines("C:\obs-dev\obs.def", $defContent, [System.Text.Encoding]::ASCII)
        
        & lib /def:C:\obs-dev\obs.def /out:C:\obs-dev\obs.lib /machine:x64

    - name: 5. Forditas (DLL)
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        
        $cmakeFile = Get-ChildItem -Path . -Filter "CMakeLists.txt" -Recurse | Select-Object -First 1
        $sourceDir = $cmakeFile.DirectoryName
        
        # A CMake buildet a projekt almappájába irányítjuk, hogy a setup.iss relatív útvonala egyezzen
        cmake -B "$sourceDir/build" -S "$sourceDir" -DCMAKE_BUILD_TYPE=Release -DOBS_SRC="C:/obs-src" -DOBS_LIB_DIR="C:/obs-dev"
        cmake --build "$sourceDir/build" --config Release --parallel
        
        # Biztosítjuk, hogy mindkét néven (kötőjeles és aláhúzásos) létezzen a DLL az Inno Setup számára
        $dlls = Get-ChildItem -Path "$sourceDir/build" -Filter "*.dll" -Recurse
        foreach ($d in $dlls) {
            Write-Host "Leforditott DLL: $($d.FullName)"
            $altName1 = Join-Path $d.DirectoryName "cycles_vj.dll"
            $altName2 = Join-Path $d.DirectoryName "cycles-vj.dll"
            Copy-Item $d.FullName -Destination $altName1 -Force
            Copy-Item $d.FullName -Destination $altName2 -Force
        }

    - name: 6. Telepito (.exe) Generalasa
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        
        $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source
        }
        
        $issFile = Get-ChildItem -Path . -Filter "setup.iss" -Recurse | Select-Object -First 1
        Write-Host "Inno Setup futtatasa: $($issFile.FullName)"
        & $iscc $issFile.FullName

    - name: 7. Telepito Feltoltese
      uses: actions/upload-artifact@v4
      with:
        name: Cycles_VJ_Plugin_Setup
        path: |
          **/Output/*.exe
          **/build/Release/*.dll
        if-no-files-found: error
