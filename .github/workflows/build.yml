name: Build Cycles VJ OBS Plugin

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: 1. Forras letoltese
      uses: actions/checkout@v4

    - name: 2. MSVC Fordito beallitasa
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: 3. Inno Setup Telepitese
      run: choco install innosetup -y --no-progress

    - name: 4. OBS SDK es Lib elokeszitese
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        
        New-Item -ItemType Directory -Path "C:\obs-bin", "C:\obs-dev" -Force | Out-Null
        
        Write-Host "OBS 30.0.2 letoltesi URL lekerese a GitHub API-bol..."
        $release = Invoke-RestMethod -Uri "https://api.github.com/repos/obsproject/obs-studio/releases/tags/30.0.2" -Headers @{ "User-Agent" = "PowerShell" }
        $asset = $release.assets | Where-Object { $_.name -like "*.zip" -and $_.name -notlike "*pdb*" } | Select-Object -First 1
        
        if (-not $asset) {
            $downloadUrl = "https://github.com/obsproject/obs-studio/releases/download/30.0.2/OBS-Studio-30.0.2.zip"
        } else {
            $downloadUrl = $asset.browser_download_url
        }
        
        Write-Host "Letoltes innen: $downloadUrl"
        curl.exe -fL $downloadUrl -o "obs.zip"
        
        Write-Host "Kibontas folyamatban..."
        7z x "obs.zip" -o"C:\obs-bin" -y | Out-Null
        
        Write-Host "OBS forraskod letoltese..."
        git clone --depth 1 https://github.com/obsproject/obs-studio.git -b 30.0.2 C:\obs-src
        
        # obs.dll felkutatasa
        $dll = Get-ChildItem -Path "C:\obs-bin" -Filter "obs.dll" -Recurse | Select-Object -First 1 -ExpandProperty FullName
        if (-not $dll) {
            throw "Nem talalhato az obs.dll a kibontott fajlok kozott!"
        }
        Write-Host "Megtalalt DLL: $dll"
        
        # Exportok kinyerese es .lib generalasa
        $rawDump = & dumpbin /exports $dll
        $exports = $rawDump | ForEach-Object {
            if ($_ -match '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)') { $matches[1] }
        }
        
        if (-not $exports) {
            throw "Nem sikerult exportokat talalni az obs.dll-ben!"
        }
        
        $defContent = @("EXPORTS") + $exports
        [System.IO.File]::WriteAllLines("C:\obs-dev\obs.def", $defContent, [System.Text.Encoding]::ASCII)
        
        & lib /def:C:\obs-dev\obs.def /out:C:\obs-dev\obs.lib /machine:x64
        Write-Host "C:\obs-dev\obs.lib sikeresen eloallitva!"

    - name: 5. Forditas (DLL)
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        
        # Automatikusan megkeresi a CMakeLists.txt fajlt a repoban
        $cmakeFile = Get-ChildItem -Path . -Filter "CMakeLists.txt" -Recurse | Select-Object -First 1
        if (-not $cmakeFile) {
            throw "Nem talalhato CMakeLists.txt a repoban! Gyozodj meg rola, hogy feltoltotted a CMakeLists.txt fajlt."
        }
        $sourceDir = $cmakeFile.DirectoryName
        Write-Host "CMakeLists.txt konyvtar: $sourceDir"
        
        cmake -B build -S "$sourceDir" -DCMAKE_BUILD_TYPE=Release -DOBS_SRC="C:/obs-src" -DOBS_LIB_DIR="C:/obs-dev"
        cmake --build build --config Release --parallel

    - name: 6. Telepito (.exe) Generalasa
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        
        $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source
        }
        
        # Inno Setup szkript megkeresese
        $issFile = Get-ChildItem -Path . -Filter "setup.iss" -Recurse | Select-Object -First 1
        if ($issFile) {
            & $iscc $issFile.FullName
        } else {
            & $iscc installer/setup.iss
        }

    - name: 7. Telepito Feltoltese
      uses: actions/upload-artifact@v4
      with:
        name: Cycles_VJ_Plugin_Setup
        path: |
          installer/Output/*.exe
          Output/*.exe
          build/Release/*.dll
        if-no-files-found: error
